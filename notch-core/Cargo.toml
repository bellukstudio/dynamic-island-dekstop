[package]
name = "notch-core"
version = "0.1.0"
edition = "2021"
description = "Logika inti Notch yang tidak bergantung pada UI (dipakai Tauri dan Slint)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network", "disk"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power"] }
