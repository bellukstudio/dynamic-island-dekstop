[package]
name = "notch-slint"
version = "0.1.0"
edition = "2021"
description = "Prototipe Notch dengan Slint (Windows dulu)"

[features]
default = ["software"]
# Default. Terukur di Windows: ~2,4 MB RAM idle. Emoji ditampilkan sebagai gambar (assets/emoji).
software = ["slint/renderer-software"]
# Renderer GPU (OpenGL). Terukur di Windows: emoji berwarna, tapi ~108 MB RAM. Tidak disarankan.
femtovg = ["slint/renderer-femtovg"]

[dependencies]
notch-core = { path = "../notch-core", features = ["net"] }
notch-tools = { path = "../notch-tools" }
png = { version = "0.17", default-features = false }   # hanya untuk 3 gambar emoji kecil
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "compat-1-2", "unstable-winit-030", "image-default-formats"] }
arboard = { version = "3", default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.3"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "sync", "time", "rt-multi-thread", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_WinRT", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_Media_Multimedia", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Media_MediaFoundation"] }

[build-dependencies]
slint-build = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
