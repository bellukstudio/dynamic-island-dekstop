[package]
name = "WellNotch"
version = "1.3.3"
description = "A Tauri App"
authors = ["bellukstudio"]
edition = "2024"

[lib]
# The `_lib` suffix is needed to avoid name conflicts on Windows.
name = "notch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
toml = "0.8"
tauri = { version = "2", features = ["tray-icon", "unstable"] }   # unstable: Window::add_child (satu jendela WhatsApp, banyak webview)
tauri-plugin-opener = "2"
tauri-plugin-drag = "2"   # drag file keluar dari notch (shelf) ke File Explorer
tauri-plugin-global-shortcut = "2"   # BARU: drag file keluar dari notch (shelf) ke File Explorer / aplikasi lain
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["blocking", "json"] }
notch-core = { path = "../notch-core" }   # logika inti bersama (stats, dst.); sysinfo kini ada di sini
arboard = { version = "3", default-features = false }
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "bmp", "webp", "gif"] }   # Compress & Convert: gambar
zip = "2"        # Compress: Office (DOCX/XLSX/PPTX) dan pengemasan ZIP; officepdf: membaca paket OOXML
lopdf = "0.34"   # Compress: PDF; officepdf: menulis PDF
rfd = "0.15"     # Compress: dialog pilih file
flate2 = "1"
pdfium-render = "0.8"
roxmltree = "0.20"   # officepdf: parser XML (DOCX/XLSX/PPTX -> PDF tanpa LibreOffice)
ttf-parser = "0.25"  # officepdf: metrik & cmap font TrueType
subsetter = "0.2"    # officepdf: subset font agar PDF kecil
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }   # share: server web transfer file
tokio = { version = "1", features = ["fs", "io-util", "net", "sync", "time", "rt-multi-thread", "macros"] }   # share: (sudah ikut Tauri; fitur tambahan)
tokio-util = { version = "0.7", features = ["io"] }   # share: streaming unduhan
futures-util = "0.3"   # share: streaming unggahan; mirror: split WebSocket
getrandom = "0.3"      # share: token acak; mirror: scid
qrcode = { version = "0.14", default-features = false, features = ["svg"] }   # share: QR
local-ip-address = "0.6"   # share: alamat IP jaringan lokal
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }   # share/LAN: TLS 1.3 (ring, tanpa cmake/nasm)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.13"      # share/LAN: sertifikat self-signed per perangkat
sha2 = "0.10"       # share/LAN: sidik jari & kode verifikasi
mdns-sd = "0.13"    # share/LAN: penemuan perangkat Notch lain
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }   # mirror: WebSocket lokal (tanpa TLS)

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
mpris = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.61"   # dibutuhkan makro #[implement] (callback sensor kamera)
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_WinRT",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Media_Audio",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_MediaFoundation",   # <-- BARU: IMFSensorActivityMonitor (indikator kamera)
  "Devices",
  "Devices_Enumeration",           # MTP: cari HP (DeviceInformation)
  "Devices_Portable",              # MTP: StorageDevice
  "Storage",                       # MTP: StorageFolder/StorageFile
  "Storage_FileProperties",        # MTP: ukuran file
  "Storage_Search",                # MTP: StorageFolder & StorageDevice::FromId ada di balik fitur ini
  "Win32_System_Time",             # MTP: waktu lokal untuk tanggal file
  "Devices_Radios",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_LibraryLoader",    # loupe color picker (GetModuleHandleW)
  "Win32_System_DataExchange",     # GetClipboardSequenceNumber (pantau clipboard tanpa membukanya)
  "Win32_Graphics_Gdi",            # BARU: GetMonitorInfoW (area kerja tanpa taskbar)
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# panic = "abort" DIHAPUS: officepdf membungkus konversi dengan catch_unwind agar dokumen aneh
# tidak menjatuhkan seluruh aplikasi; itu hanya bekerja dengan panic = "unwind" (bawaan).
strip = true
